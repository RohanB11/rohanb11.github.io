---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-5">
    <h4 class="fw-bold">Research Interests</h4>
    {{ content }}
  </div>
  <div class="col-md-7">
    <img src="assets/img/2026 oct.001.jpeg" alt="Home" width="100%">
  </div>
</div>
{% include publications.html %}

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h4 class="fw-bold border-bottom pb-3 mb-5">Updates</h4>
    {% for post in site.posts %}
      <p><a href="{{ site.github.url }}/{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %-d, %Y" }}</p>
    {% endfor %}
  </div>
</div>
